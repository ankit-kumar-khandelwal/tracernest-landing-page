<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="50%" stop-color="#060e20"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>
    <linearGradient id="laravelAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D20"/>
      <stop offset="100%" stop-color="#F05340"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glowLaravel" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FF2D20" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF2D20" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowLaravel)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Header Brand Pill -->
  <g transform="translate(80, 72)">
    <rect width="210" height="42" rx="21" fill="#0c1a30" stroke="#1e3a5f" stroke-width="1.5"/>
    <!-- Icon -->
    <g transform="translate(14, 9) scale(0.95)">
      <path d="M4 14c0 7 16 7 16 0" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M4 9h4.5l3.5 5 3.5-5H20" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="12" cy="6" r="2.2" fill="#38bdf8"/>
    </g>
    <text x="46" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="-0.2">TracerNest</text>
    <rect x="136" y="10" width="62" height="22" rx="6" fill="#1e293b"/>
    <text x="167" y="25" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">LOGGER</text>
  </g>

  <!-- Laravel 13 Release Badge -->
  <g transform="translate(306, 72)">
    <rect width="190" height="42" rx="21" fill="rgba(255, 45, 32, 0.12)" stroke="#FF2D20" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="5" fill="#FF2D20"/>
    <text x="38" y="26" fill="#FF2D20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">LARAVEL 13 BRIDGE</text>
  </g>

  <!-- Live Status Badge -->
  <g transform="translate(980, 72)">
    <rect width="140" height="42" rx="21" fill="#06201a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="5" fill="#10b981"/>
    <text x="40" y="26" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">SELF-HOSTED</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="210" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">
    Laravel Logging Dashboard
  </text>
  <text x="80" y="268" fill="url(#laravelAccent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">
    Self-Hosted Monolog Viewer &amp; Encrypted Log Vault
  </text>

  <!-- Subtitle -->
  <text x="80" y="325" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Zero extra open ports &bull; Native AES-256-GCM encryption &bull; Embedded in your existing web server
  </text>

  <!-- Feature Grid Cards -->
  <g transform="translate(80, 375)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="240" height="150" rx="14" fill="#081426" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="24" y="44" fill="#FF2D20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ZERO EXTRA PORTS</text>
    <text x="24" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Port 80 / 443</text>
    <text x="24" y="112" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Binds directly to Nginx &amp; Octane routes</text>

    <!-- Card 2 -->
    <rect x="264" y="0" width="240" height="150" rx="14" fill="#081426" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="288" y="44" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">SECURITY VAULT</text>
    <text x="288" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">AES-256-GCM</text>
    <text x="288" y="112" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">At-rest authenticated cryptographic vault</text>

    <!-- Card 3 -->
    <rect x="528" y="0" width="240" height="150" rx="14" fill="#081426" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="552" y="44" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ZERO SAAS BILLS</text>
    <text x="552" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">100% Free</text>
    <text x="552" y="112" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Apache 2.0 open-source architecture</text>

    <!-- Card 4 -->
    <rect x="792" y="0" width="248" height="150" rx="14" fill="#081426" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="816" y="44" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">AUTO MIGRATION</text>
    <text x="816" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">SQLite &rarr; MySQL</text>
    <text x="816" y="112" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Zero-downtime historical log migration</text>
  </g>

  <!-- Footer Info -->
  <text x="80" y="572" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">
    tracernest.info/laravel-logging-dashboard.html &bull; Apache-2.0 License &bull; Monolog &amp; Laravel 13 Ready
  </text>
</svg>
